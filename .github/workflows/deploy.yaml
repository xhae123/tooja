name: Test and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - adr/**
      - docs/**
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - adr/**
      - docs/**
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooja-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # gradle/actions/setup-gradle@v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install report generator only (no Playwright)
        run: npm ci --prefix ci --ignore-scripts
      - name: Test and build deployable JAR
        run: ./gradlew clean test bootJar
      - name: Generate Allure from this run's JVM results only
        if: always()
        run: |
          node scripts/prepare-allure.mjs --jvm-only
          ci/node_modules/.bin/allure generate reports/raw/allure-prepared --clean --single-file -o reports/ci-allure
      - name: Preserve test evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: test-evidence-${{ github.run_number }}
          path: |
            reports/ci-allure
            build/test-results/test
            build/reports/tests/test
            build/reports/jacoco/test
            reports/raw/allure-prepared
          retention-days: 14
      - name: Package tested release
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/package-release.py
      - name: Upload immutable release artifact
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.sha }}
          path: build/release.tar.gz
          retention-days: 14
  deploy:
    name: Deploy tested release to OCI
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: oci
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy through dedicated restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.OCI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.OCI_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tooja-deploy
          chmod 600 ~/.ssh/tooja-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/tooja-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" < release/release.tar.gz | tee /tmp/tooja-deploy.log
          rm -f ~/.ssh/tooja-deploy
      - name: Verify SSH-authenticated nginx checks and matching report commit
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          lines=open('/tmp/tooja-deploy.log').read().splitlines()
          evidence=[line.removeprefix('DEPLOYMENT_VERIFIED ') for line in lines if line.startswith('DEPLOYMENT_VERIFIED ')]
          assert len(evidence)==1,'Missing or duplicate server verification'
          m=json.loads(evidence[0])
          assert m['commit']==os.environ['EXPECTED_COMMIT'],m
          assert m['tests']['e2e']==0 and m['tests']['failed']==0,m
          print('Nginx health/OpenAPI/Allure verified on host. Deployed commit:',m['commit'],'Tests:',m['tests'])
          PY
          # shellcheck disable=SC2016
          printf 'Deployed `%s`\n\n- [Swagger](%s/api-docs)\n- [Allure: unit/integration only](%s/reports/allure/)\n' "$EXPECTED_COMMIT" "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
