name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooja-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install report generator only (no Playwright)
        run: npm ci --prefix ci --ignore-scripts
      - name: Test and build deployable JAR
        run: ./gradlew clean test bootJar
      - name: Generate Allure from this run's JVM results only
        if: always()
        run: |
          node scripts/prepare-allure.mjs --jvm-only
          ci/node_modules/.bin/allure generate reports/raw/allure-prepared --clean --single-file -o reports/ci-allure
      - name: Preserve test evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_number }}
          path: |
            reports/ci-allure
            build/test-results/test
            build/reports/tests/test
            build/reports/jacoco/test
            reports/raw/allure-prepared
          retention-days: 14
      - name: Package tested release
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/package-release.py
      - name: Upload immutable release artifact
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: build/release.tar.gz
          retention-days: 14
  deploy:
    name: Deploy tested release to OCI
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: oci
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy through dedicated restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.OCI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.OCI_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tooja-deploy
          chmod 600 ~/.ssh/tooja-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/tooja-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" < release/release.tar.gz
          rm -f ~/.ssh/tooja-deploy
      - name: Verify public deployment and matching report commit
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          curl --fail --retry 3 "$APP_URL/actuator/health"
          curl --fail "$APP_URL/v3/api-docs" -o /tmp/openapi.json
          curl --fail "$APP_URL/reports/allure/index.html" -o /tmp/allure.html
          curl --fail "$APP_URL/deployment.json" -o /tmp/deployment.json
          python3 - <<'PY'
          import json,os
          m=json.load(open('/tmp/deployment.json'))
          assert m['commit']==os.environ['EXPECTED_COMMIT'],m
          assert m['tests']['e2e']==0,m
          print('Deployed commit:',m['commit'],'Tests:',m['tests'])
          PY
          # shellcheck disable=SC2016
          printf 'Deployed `%s`\n\n- [Swagger](%s/api-docs)\n- [Allure: unit/integration only](%s/reports/allure/)\n' "$EXPECTED_COMMIT" "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
