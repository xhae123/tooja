spring:
  application:
    name: tooja
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/tooja.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  thymeleaf:
    cache: true
    check-template-location: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
  tomcat:
    # Behind the LB the app sees plain HTTP; absolute redirects would point browsers at http://.
    use-relative-redirects: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
app:
  reports-enabled: ${REPORTS_ENABLED:false}
  report-root: ${REPORT_ROOT:./reports}
  provisioning-mode: ${PROVISIONING_MODE:required}
  origin: ${APP_ORIGIN:http://localhost:8080}
  allowed-origins: ${APP_ALLOWED_ORIGINS:${APP_ORIGIN:http://localhost:8080}}
  secure-cookies: ${SECURE_COOKIES:true}
  enforce-https: ${ENFORCE_HTTPS:false}
  acme-root: ${ACME_ROOT:}
  pepper: ${CODE_PEPPER:}
  accounts-csv: ${ACCOUNTS_CSV:}
  teams-csv: ${TEAMS_CSV:}
  owner-token: ${OWNER_TOKEN:}
  ingest-token: ${INGEST_TOKEN:}
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  ops:
    scheduling-enabled: ${OPS_SCHEDULING:true}
    sample-interval-ms: 60000
    collector-interval-ms: 60000
    heartbeat-gap-factor: 3
    activity-retention-days: 90
    samples-retention-days: 30
    events-retention-days: 365
    queue-capacity: 10000
    disk-path: ${OPS_DISK_PATH:./data}
springdoc:
  swagger-ui:
    path: /api-docs
    tags-sorter: alpha
    operations-sorter: alpha
    default-models-expand-depth: -1

server.tomcat.connection-timeout: 15s
server.tomcat.keep-alive-timeout: 30s
