<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('로그인')}"></head>
<body class="login-body">
<main class="login">
    <h1>조물주</h1>
    <p class="muted">조회 전용 운영자 콘솔입니다. 운영 환경의 OWNER_TOKEN을 입력하세요.</p>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form method="post" action="/owner/login">
        <input type="hidden" name="_csrf" th:value="${csrf}">
        <label for="token">토큰</label>
        <input id="token" name="token" type="password" autocomplete="off" required minlength="32" autofocus>
        <button type="submit">들어가기</button>
    </form>
</main>
</body>
</html>
