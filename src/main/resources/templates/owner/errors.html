<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('오류')}"></head>
<body>
<nav th:replace="~{owner/layout :: nav('errors')}"></nav>
<main>
    <header class="page-head"><h1>서버 오류</h1><p class="muted">5xx 응답과 SERVICE_UNAVAILABLE·INTERNAL_ERROR 요청입니다. requestId로 OCI 로그의 server_error 항목과 맞춰 볼 수 있습니다.</p></header>
    <form class="filters" method="get" action="/owner/errors">
        <label>시작 <input type="datetime-local" name="from" th:value="${f['from']}"></label>
        <label>끝 <input type="datetime-local" name="to" th:value="${f['to']}"></label>
        <label>코드 <input name="code" th:value="${f['code']}" placeholder="SERVICE_UNAVAILABLE"></label>
        <button type="submit">조회</button> <a class="quiet-link" href="/owner/errors">초기화</a>
    </form>
    <table th:replace="~{owner/layout :: activityTable(${result.items})}"></table>
    <div th:replace="~{owner/layout :: more(${result}, ${base})}"></div>
</main>
</body>
</html>
