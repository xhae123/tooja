<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('이벤트')}"></head>
<body>
<div class="shell">
<aside th:replace="~{owner/layout :: sidebar('events')}"></aside>
<div class="content">
<header th:replace="~{owner/layout :: topbar('시스템 이벤트', '기동 · 종료 · 다운타임 · 수집기', null)}"></header>
<main>
    <form class="filterbar" method="get" action="/owner/events">
        <label>종류 <select class="select" name="type"><option value="">전체</option><option th:each="t : ${ {'app_started','app_stopping','downtime_detected','db_unreachable','collector_offline','collector_online','external_unavailable'} }" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option></select></label>
        <div class="actions"><button type="submit" class="btn primary">조회</button><a class="btn quiet" href="/owner/events">초기화</a></div>
    </form>
    <section class="card"><div class="body">
        <ul class="timeline" th:if="${!#lists.isEmpty(result.items)}">
            <li th:each="e : ${result.items}" th:classappend="${e.type == 'downtime_detected' or e.type == 'db_unreachable' or e.type == 'external_unavailable'} ? 'bad' : (${e.type == 'collector_offline' or e.type == 'app_stopping'} ? 'warn' : (${e.type == 'app_started' or e.type == 'collector_online'} ? 'good' : 'info'))">
                <div class="when"><span th:text="${fmt.timeFull(e.ts)}"></span> KST · <time data-rel th:attr="data-ms=${e.ts}"></time></div>
                <div class="what"><span class="badge" th:classappend="${e.type == 'downtime_detected' or e.type == 'db_unreachable' or e.type == 'external_unavailable'} ? 'bad' : (${e.type == 'collector_offline' or e.type == 'app_stopping'} ? 'warn' : 'good')" th:text="${e.type}"></span></div>
                <div class="detail" th:if="${e.detail != null}" th:text="${e.detail}"></div>
            </li>
        </ul>
        <th:block th:if="${#lists.isEmpty(result.items)}"><div th:replace="~{owner/layout :: empty('이벤트가 없습니다', '다운타임은 heartbeat 공백이 3분을 넘을 때 기록됩니다.')}"></div></th:block>
    </div><div th:replace="~{owner/layout :: more(${result}, ${base})}"></div></section>
</main>
</div></div>
<script src="/owner/assets/owner.js"></script>
</body>
</html>
