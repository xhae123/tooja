<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('이벤트')}"></head>
<body>
<nav th:replace="~{owner/layout :: nav('events')}"></nav>
<main>
    <header class="page-head"><h1>시스템 이벤트</h1><p class="muted">기동·종료·다운타임·수집기 이탈·DB 연결 실패를 기록합니다. 다운타임은 마지막 heartbeat와 다음 기동 사이의 공백입니다.</p></header>
    <form class="filters" method="get" action="/owner/events">
        <label>종류 <select name="type"><option value="">전체</option><option th:each="t : ${ {'app_started','app_stopping','downtime_detected','db_unreachable','collector_offline','collector_online','external_unavailable'} }" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option></select></label>
        <button type="submit">조회</button>
    </form>
    <table class="grid">
        <thead><tr><th>시각(KST)</th><th>종류</th><th>내용</th></tr></thead>
        <tbody>
        <tr th:each="e : ${result.items}" th:classappend="${e.type == 'downtime_detected' or e.type == 'db_unreachable' or e.type == 'external_unavailable'}?'bad':(${e.type == 'collector_offline' or e.type == 'app_stopping'}?'warn':'')">
            <td th:text="${fmt.timeFull(e.ts)}" th:title="${fmt.iso(e.ts)}"></td><td><span class="role" th:text="${e.type}"></span></td><td class="mono" th:text="${e.detail ?: ''}"></td></tr>
        <tr th:if="${#lists.isEmpty(result.items)}"><td colspan="3" class="muted">이벤트가 없습니다.</td></tr>
        </tbody>
    </table>
    <div th:replace="~{owner/layout :: more(${result}, ${base})}"></div>
</main>
</body>
</html>
