<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('세션')}"></head>
<body>
<nav th:replace="~{owner/layout :: nav('sessions')}"></nav>
<main>
    <header class="page-head"><h1>세션 <span class="muted" th:text="${#lists.size(rows)} + '건'"></span></h1><p class="muted">세션 토큰은 해시 앞 8자만 표시합니다. 투자자·관리자 세션은 48시간, 조물주 세션은 12시간입니다.</p></header>
    <form class="filters" method="get" action="/owner/sessions">
        <label>역할 <select name="role"><option value="">전체</option><option th:each="r : ${ {'INVESTOR','ADMIN','OWNER'} }" th:value="${r}" th:text="${r}" th:selected="${r == role}"></option></select></label>
        <label><input type="checkbox" name="active" value="1" th:checked="${active}"> 활성만</label>
        <button type="submit">조회</button>
    </form>
    <table class="grid">
        <thead><tr><th>상태</th><th>역할</th><th>계정</th><th>이름</th><th>만료</th><th>종료</th><th>생성</th><th>IP</th><th>UA</th><th>토큰 해시</th></tr></thead>
        <tbody>
        <tr th:each="s : ${rows}" th:classappend="${s.active}?'':'muted'">
            <td th:text="${s.active ? '활성' : (s.revoked_at != null ? '로그아웃' : '만료')}" th:classappend="${s.active}?'good'"></td>
            <td><span class="role" th:text="${s.role}"></span></td>
            <td class="mono"><a th:if="${s.role != 'OWNER'}" th:href="@{/owner/accounts/{id}(id=${s.account_id})}" th:text="${s.account_id}"></a><span th:if="${s.role == 'OWNER'}">owner</span></td>
            <td th:text="${s.alias}"></td>
            <td th:text="${fmt.isoTime(s.expires_at)}"></td>
            <td th:text="${s.revoked_at != null ? fmt.isoTime(s.revoked_at) : ''}"></td>
            <td th:text="${s.created_at != null ? fmt.isoTime(s.created_at) : ''}"></td>
            <td class="mono" th:text="${s.client_ip ?: ''}"></td>
            <td class="ua" th:text="${s.user_agent ?: ''}" th:title="${s.user_agent}"></td>
            <td class="mono muted" th:text="${#strings.substring(s.token_hash, 0, 8)} + '…'"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}"><td colspan="10" class="muted">세션이 없습니다.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
