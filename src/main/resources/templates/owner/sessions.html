<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('세션')}"></head>
<body>
<div class="shell">
<aside th:replace="~{owner/layout :: sidebar('sessions')}"></aside>
<div class="content">
<header th:replace="~{owner/layout :: topbar('세션', ${#lists.size(rows)} + '건', null)}"></header>
<main>
    <form class="filterbar" method="get" action="/owner/sessions">
        <label>역할 <select class="select" name="role"><option value="">전체</option><option th:each="r : ${ {'INVESTOR','ADMIN','OWNER'} }" th:value="${r}" th:text="${r}" th:selected="${r == role}"></option></select></label>
        <label style="flex-direction:row;align-items:center;gap:6px;padding-bottom:6px"><input type="checkbox" name="active" value="1" th:checked="${active}"> 활성만</label>
        <div class="actions"><button type="submit" class="btn primary">조회</button></div>
    </form>
    <p class="muted" style="margin:-6px 0 12px;font-size:12.5px">세션 토큰은 해시 앞 8자만 표시합니다. 투자자·관리자 48시간, 조물주 12시간.</p>
    <section class="card flush">
        <div class="table-wrap"><table class="table">
            <thead><tr><th>상태</th><th>역할</th><th>계정</th><th>만료</th><th>종료</th><th>생성</th><th>클라이언트</th><th>토큰 해시</th></tr></thead>
            <tbody>
            <tr th:each="s : ${rows}">
                <td><span class="badge" th:classappend="${s.active} ? 'good' : 'neutral'"><span class="dot" th:if="${s.active}"></span><span th:text="${s.active ? '활성' : (s.revoked_at != null ? '로그아웃' : '만료')}"></span></span></td>
                <td><span class="badge" th:classappend="${s.role == 'OWNER'} ? 'info' : 'neutral'" th:text="${s.role}"></span></td>
                <td><a th:if="${s.role != 'OWNER'}" class="row-link" th:href="@{/owner/accounts/{id}(id=${s.account_id})}" th:text="${s.alias}"></a><span th:if="${s.role == 'OWNER'}">조물주</span><span class="sub mono" th:text="${s.account_id}"></span></td>
                <td th:text="${fmt.isoTime(s.expires_at)}"></td>
                <td th:text="${s.revoked_at != null ? fmt.isoTime(s.revoked_at) : '—'}"></td>
                <td th:text="${s.created_at != null ? fmt.isoTime(s.created_at) : '—'}"></td>
                <td><span class="mono" th:text="${s.client_ip ?: '—'}"></span><span class="sub trunc" th:text="${s.user_agent ?: ''}" th:title="${s.user_agent}"></span></td>
                <td class="mono muted" th:text="${#strings.substring(s.token_hash, 0, 8)} + '…'"></td>
            </tr>
            </tbody>
        </table></div>
        <th:block th:if="${#lists.isEmpty(rows)}"><div th:replace="~{owner/layout :: empty('세션이 없습니다', '')}"></div></th:block>
    </section>
</main>
</div></div>
<script src="/owner/assets/owner.js"></script>
</body>
</html>
