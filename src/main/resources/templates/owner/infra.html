<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{owner/layout :: head('인프라')}"></head>
<body>
<div class="shell">
<aside th:replace="~{owner/layout :: sidebar('infra')}"></aside>
<div class="content">
<header th:replace="~{owner/layout :: topbar('인프라', ${single} ? ${charts[0].source} + ' · ' + ${charts[0].metric} : '주요 지표', 60)}"></header>
<main>
    <div class="filterbar" style="align-items:center">
        <span class="seg"><a th:each="r : ${ {'1h','6h','24h','7d'} }" th:classappend="${r == range}?'active'" th:href="@{/owner/infra(range=${r},source=${single ? charts[0].source : null},metric=${single ? charts[0].metric : null})}" th:text="${r}"></a></span>
        <span class="muted" style="font-size:12.5px">앱은 1분마다 스스로 재고, host·oci 값은 서버 수집기가 넘겨줍니다. 선은 버킷 평균, 띠는 최소~최대. 차트 위에 마우스를 올리면 값이 보입니다.</span>
        <a class="btn quiet sm" th:if="${single}" th:href="@{/owner/infra(range=${range})}" style="margin-left:auto">← 주요 지표</a>
    </div>
    <section th:classappend="${single}?'charts single':'charts'">
        <th:block th:each="c : ${charts}"><figure th:replace="~{owner/chart :: chart(${c}, ${range}, ${single})}"></figure></th:block>
        <div th:if="${#lists.isEmpty(charts)}" class="card" style="grid-column:1/-1"><div th:replace="~{owner/layout :: empty('표시할 지표가 없습니다', '앱 샘플은 기동 1분 후, 호스트·OCI 지표는 수집기 연결 후 나타납니다.')}"></div></div>
    </section>
    <section class="card"><header><h2>지표 목록 <span class="sub">출처별 · 마지막 값</span></h2></header><div class="body">
        <div th:each="g : ${availableBySource}" th:with="src=${g.key},rows=${g.value}" style="margin-bottom:12px">
            <h3 style="margin-bottom:6px"><span class="badge neutral" th:text="${src}"></span> <span class="muted" th:text="${#lists.size(rows)} + '개'"></span></h3>
            <div class="metric-chips">
                <a th:each="m : ${rows}" th:href="@{/owner/infra(source=${m.source},metric=${m.metric},range=${range})}" th:classappend="${single and charts[0].source == m.source and charts[0].metric == m.metric}?'active'" th:title="${fmt.timeFull(m.ts)}"><span th:text="${m.metric}"></span> <b th:text="${fmt.metric(m.metric, m.sample_value)}"></b></a>
                <span th:if="${#lists.isEmpty(rows)}" class="muted" style="font-size:12.5px">아직 없음</span>
            </div>
        </div>
    </div></section>
</main>
</div></div>
<script src="/owner/assets/owner.js"></script>
</body>
</html>
