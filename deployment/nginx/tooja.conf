# Operator-managed; app CI/CD never copies or reloads this file.
# Country data: DB-IP IP to Country Lite, CC BY 4.0, https://db-ip.com
geo $tooja_country_allowed {
    default 0;
    include /etc/nginx/conf.d/tooja-kr-cidrs.inc;
    # Local host checks traverse Docker's gateway. No forwarded-header trust.
    127.0.0.1/32 1;
    ::1/128 1;
    172.19.0.1/32 1;
}
limit_req_zone $server_name zone=tooja_api_total:10m rate=500r/s;
server {
    listen 80 default_server;
    server_name api.leafeep.com 129.225.170.51;
    # HTTP-01 must remain public for certificate issuance and renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 308 https://api.leafeep.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name api.leafeep.com;
    ssl_certificate /etc/letsencrypt/live/tooja-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tooja-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tooja_tls:10m;
    ssl_session_timeout 1d;
    # Existing nginx default is 1 MiB; keep it explicit instead of widening to 3 MiB.
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    proxy_connect_timeout 5s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tooja_backend tooja-app:8080;
    if ($tooja_country_allowed = 0) { return 403; }
    error_page 403 = @country_blocked;
    error_page 429 = @rate_limited;
    error_page 413 = @body_too_large;
    location @country_blocked {
        default_type text/html;
        charset utf-8;
        return 403 '<!doctype html><html lang="ko"><meta charset="utf-8"><title>접속 제한</title><h1>한국에서 접속해 주세요.</h1><p>접속 IP가 한국으로 분류되지 않아 접근이 제한되었습니다.</p><p><a href="https://db-ip.com">IP Geolocation by DB-IP</a></p></html>';
    }
    location @body_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"REQUEST_BODY_TOO_LARGE","message":"요청 본문은 1MiB 이하여야 합니다.","details":{"maxBytes":1048576}},"requestId":"$request_id"}';
    }
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"요청이 많습니다. 잠시 후 다시 시도해 주세요.","details":{}},"requestId":"$request_id"}';
    }
    location /api/ {
        # All API routes, including login, share one service-wide bucket.
        limit_req zone=tooja_api_total burst=1000 nodelay;
        limit_req_status 429;
        proxy_pass http://$tooja_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://$tooja_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
